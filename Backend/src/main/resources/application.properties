spring.application.name=chatapp
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/ai_chat_app
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.ai.openai.chat.enabled=false
spring.ai.openai.embedding.enabled=false
spring.ai.openai.image.enabled=false
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.api-key=${OPENAI_API_KEY}
# ==================== Spring AI ====================
# Switch between "openai" and "ollama" without touching any Java code


# ---- OpenAI ----
# Set the real key as an environment variable, never commit it to Git

spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

# ---- Ollama (local models, no API key needed) ----
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.init.pull-model-strategy=never

# Spring AI's Ollama/OpenAI clients are built from Spring Boot's
# auto-configured RestClient, which has NO timeout by default — a
# stuck HTTP call would block its thread forever, even though our own
# CompletableFuture.get(timeout) in SmartReplyService/AiAssistantService
# stops *waiting* for it. Future.get(timeout) does not cancel the
# underlying call, so without this, one hung request quietly leaks a
# thread and eventually starves every other AI call in the app. This
# caps every outgoing AI HTTP call app-wide so a hang actually ends.
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=40s

logging.level.org.springframework.security=DEBUG
# ==================== JWT ====================
# Set a real secret as an environment variable before deploying.
# The fallback below is intentionally obvious/insecure so you notice it.
app.jwt.secret=${JWT_SECRET:CHANGE-ME-set-JWT_SECRET-env-var-before-deploying}
app.jwt.expiration-ms=86400000
app.ai.provider=ollama
