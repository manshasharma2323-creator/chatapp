spring.application.name=chatapp
# Most PaaS hosts (Render, Railway, Heroku, etc.) assign a port at runtime
# via the PORT env var and route traffic only to that port — hardcoding
# 8080 would make the deployed app unreachable on those platforms.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_chat_app}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.ai.openai.chat.enabled=false
spring.ai.openai.embedding.enabled=false
spring.ai.openai.image.enabled=false
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.api-key=${OPENAI_API_KEY}
# ==================== Spring AI ====================
# Switch between "openai" and "ollama" without touching any Java code


# ---- OpenAI ----
# Set the real key as an environment variable, never commit it to Git

spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

# ---- Ollama (local models, no API key needed) ----
# Override with OLLAMA_BASE_URL if Ollama is hosted somewhere other than
# the same machine as the backend (e.g. a separate Ollama server/container).
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.init.pull-model-strategy=never

# Spring AI's Ollama/OpenAI clients are built from Spring Boot's
# auto-configured RestClient, which has NO timeout by default — a
# stuck HTTP call would block its thread forever, even though our own
# CompletableFuture.get(timeout) in SmartReplyService/AiAssistantService
# stops *waiting* for it. Future.get(timeout) does not cancel the
# underlying call, so without this, one hung request quietly leaks a
# thread and eventually starves every other AI call in the app. This
# caps every outgoing AI HTTP call app-wide so a hang actually ends.
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=40s

# ==================== JWT ====================
# Set a real secret as an environment variable before deploying.
# The fallback below is intentionally obvious/insecure so you notice it.
app.jwt.secret=${JWT_SECRET:CHANGE-ME-set-JWT_SECRET-env-var-before-deploying}
app.jwt.expiration-ms=86400000

# ==================== AI provider ====================
# "openai" or "ollama" to force one, or "auto" (default) to pick openai
# automatically when a real OPENAI_API_KEY is set, otherwise ollama. This
# means a production deployment that only sets OPENAI_API_KEY (and never
# touches this property) still gets a working AI provider instead of
# silently defaulting to a local Ollama instance that won't exist there.
app.ai.provider=${APP_AI_PROVIDER:auto}

# How long to wait for the AI provider before falling back (Smart Reply) or
# returning an error (AI Assistant). Defaults are tuned for typical
# GPU-accelerated or cloud (OpenAI) latency; raise these if running Ollama
# on CPU-only hardware where even a warm model can take longer per request.
app.ai.smart-reply-timeout-seconds=${AI_SMART_REPLY_TIMEOUT_SECONDS:12}
app.ai.assistant-timeout-seconds=${AI_ASSISTANT_TIMEOUT_SECONDS:35}

# ==================== CORS ====================
# Comma-separated list of origins allowed to call this API / open a
# WebSocket connection. Includes common local dev ports plus the
# deployed Vercel frontend by default; override with the ALLOWED_ORIGINS
# env var (comma-separated) if the frontend moves to a different domain.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,https://chatapp-dun-delta-57.vercel.app}
