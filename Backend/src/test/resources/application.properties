# Test-only configuration. Spring Boot uses this instead of
# src/main/resources/application.properties for any @SpringBootTest, so
# the test suite runs against an isolated in-memory H2 database and never
# touches the real MySQL instance or requires real AI provider credentials.

spring.datasource.url=jdbc:h2:mem:chatapp_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-only-secret-key-not-used-in-production-1234567890
app.jwt.expiration-ms=86400000
app.ai.provider=ollama
app.cors.allowed-origins=http://localhost:5500

spring.ai.openai.chat.enabled=false
spring.ai.openai.embedding.enabled=false
spring.ai.openai.image.enabled=false
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.api-key=test-key
