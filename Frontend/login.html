<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sign in — AI Chat Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div class="auth-shell">
    <div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>

    <!-- ---------- sign in form ---------- -->
    <section class="auth-panel">
        <div class="auth-card">
            <a class="auth-mark" href="index.html" style="text-decoration:none;color:inherit">
                <div class="logo logo-lg"><i class="fa-solid fa-bolt"></i></div>
                <div>
                    <div class="brand-name">AI Chat Hub</div>
                    <div class="brand-tag">Real-time messaging</div>
                </div>
            </a>

            <div class="auth-illustration" aria-hidden="true">
                <svg viewBox="0 0 300 100">
                    <line class="thread t1" x1="150" y1="50" x2="24" y2="10"></line>
                    <line class="thread t2" x1="150" y1="50" x2="246" y2="14"></line>
                    <line class="thread t3" x1="150" y1="50" x2="138" y2="78"></line>
                </svg>
                <div class="ai-node ai-pulse"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                <div class="mini-avatar m1" style="background:linear-gradient(135deg,#ffe066,#f6c100)">JD<span class="dot on"></span></div>
                <div class="mini-avatar m2" style="background:linear-gradient(135deg,#ffd23f,#e0a300)">AM<span class="dot on"></span></div>
                <div class="mini-avatar m3" style="background:linear-gradient(135deg,#f6c100,#b98900)">SK<span class="dot"></span></div>
            </div>

            <h1>Welcome back</h1>
            <p class="auth-sub">Sign in with the account you registered.</p>

            <div class="msg-error" id="authError" hidden></div>

            <div class="field">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" type="email" autocomplete="username" placeholder="you@example.com">
            </div>

            <div class="field">
                <label for="loginPassword">Password</label>
                <div class="pw-wrap">
                    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••">
                    <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="auth-row-split">
                <label style="display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-dim)">
                    <input type="checkbox" id="rememberMe" style="width:auto"> Remember me
                </label>
                <button type="button" class="link-btn" id="forgotBtn">Forgot password?</button>
            </div>

            <button class="btn-primary" id="loginBtn">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>&nbsp; Sign in
            </button>

            <p class="auth-alt">
                Don't have an account? <a class="link-btn" href="register.html">Create one</a>
            </p>

            <p class="auth-alt">
                <button class="link-btn" id="tokenToggle" type="button">Have a JWT instead? Paste it</button>
            </p>

            <div id="tokenBlock" hidden>
                <div class="field" style="margin-top:10px">
                    <label for="manualToken">JWT token</label>
                    <input id="manualToken" type="text" placeholder="eyJhbGciOi...">
                </div>
                <div class="field">
                    <label for="manualEmail">Your email</label>
                    <input id="manualEmail" type="email" placeholder="you@example.com">
                </div>
                <button class="btn-ghost" id="tokenLoginBtn" style="width:100%">Connect with token</button>
            </div>
        </div>
    </section>
</div>

<div class="toast-area" id="toastArea"></div>

<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script src="assets/login.js"></script>
</body>
</html>
