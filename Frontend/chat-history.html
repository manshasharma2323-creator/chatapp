<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Chat History — AI Chat Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/theme.css">
    <link rel="stylesheet" href="assets/chat-history.css">
</head>
<body>

<div id="shell"></div>

<div class="shell">
    <main class="page">
        <div class="page-head fade-up">
            <h1>Chat History</h1>
            <p>Every conversation you've had, pulled from your saved chat history — search, then jump back in.</p>
        </div>

        <div class="contacts-toolbar">
            <div class="contacts-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="searchInput" type="search" placeholder="Search by name, email, or message">
            </div>
            <span class="contacts-count" id="historyCount"></span>
        </div>

        <div class="card" id="historyCard">
            <div class="history-list" id="historyList">
                <div style="padding:16px">
                    <div class="skeleton" style="height:64px;margin-bottom:10px"></div>
                    <div class="skeleton" style="height:64px;margin-bottom:10px"></div>
                    <div class="skeleton" style="height:64px"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="toast-area" id="toastArea"></div>

<script src="assets/api.js"></script>
<script src="assets/chat-history.js"></script>
</body>
</html>
