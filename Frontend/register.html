<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Create account — AI Chat Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div class="auth-shell">
    <div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>

    <section class="auth-panel">
        <div class="auth-card">
            <a class="auth-mark" href="index.html" style="text-decoration:none;color:inherit">
                <div class="logo logo-lg"><i class="fa-solid fa-bolt"></i></div>
                <div>
                    <div class="brand-name">AI Chat Hub</div>
                    <div class="brand-tag">Real-time messaging</div>
                </div>
            </a>

            <div class="auth-illustration" aria-hidden="true">
                <svg viewBox="0 0 300 100">
                    <line class="thread t1" x1="150" y1="50" x2="24" y2="10"></line>
                    <line class="thread t2" x1="150" y1="50" x2="246" y2="14"></line>
                    <line class="thread t3" x1="150" y1="50" x2="138" y2="78"></line>
                </svg>
                <div class="ai-node ai-pulse"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                <div class="mini-avatar m1" style="background:linear-gradient(135deg,#ffdd66,#c98f00)">RT<span class="dot on"></span></div>
                <div class="mini-avatar m2" style="background:linear-gradient(135deg,#fff0bf,#e0ac00)">NP<span class="dot"></span></div>
                <div class="mini-avatar m3" style="background:linear-gradient(135deg,#ffe066,#f6c100)">YV<span class="dot on"></span></div>
            </div>

            <h1>Create your account</h1>
            <p class="auth-sub">It only takes a moment.</p>

            <div class="msg-error" id="authError" hidden></div>

            <div class="field" id="nameField">
                <label for="regName">Full name</label>
                <input id="regName" type="text" autocomplete="name" placeholder="Jane Doe">
            </div>

            <div class="field" id="emailField">
                <label for="regEmail">Email</label>
                <input id="regEmail" type="email" autocomplete="username" placeholder="you@example.com">
            </div>

            <div class="field" id="passwordField">
                <label for="regPassword">Password</label>
                <div class="pw-wrap">
                    <input id="regPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters">
                    <button type="button" class="pw-toggle" id="pwToggle1" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
                </div>
            </div>

            <div class="field" id="confirmField">
                <label for="regConfirm">Confirm password</label>
                <div class="pw-wrap">
                    <input id="regConfirm" type="password" autocomplete="new-password" placeholder="Re-enter your password">
                    <button type="button" class="pw-toggle" id="pwToggle2" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
                </div>
            </div>

            <button class="btn-primary" id="registerBtn">
                <i class="fa-solid fa-user-plus"></i>&nbsp; Create account
            </button>

            <p class="auth-alt">
                Already have an account? <a class="link-btn" href="login.html">Sign in</a>
            </p>
        </div>
    </section>
</div>

<div class="toast-area" id="toastArea"></div>

<script src="assets/api.js"></script>
<script src="assets/register.js"></script>
</body>
</html>
