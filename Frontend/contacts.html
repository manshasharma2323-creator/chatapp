<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Contacts — AI Chat Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/theme.css">
    <link rel="stylesheet" href="assets/contacts.css">
</head>
<body>

<div id="shell"></div>

<div class="shell">
    <main class="page">
        <div class="page-head fade-up">
            <h1>Contacts</h1>
            <p>Everyone registered on AI Chat Hub — start a conversation with anyone.</p>
        </div>

        <div class="contacts-toolbar">
            <div class="contacts-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="searchInput" type="search" placeholder="Search by name or email">
            </div>
            <span class="contacts-count" id="contactsCount"></span>
        </div>

        <div class="contacts-grid" id="contactsGrid">
            <div class="skeleton" style="height:132px"></div>
            <div class="skeleton" style="height:132px"></div>
            <div class="skeleton" style="height:132px"></div>
        </div>
    </main>
</div>

<div class="toast-area" id="toastArea"></div>

<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script src="assets/contacts.js"></script>
</body>
</html>
